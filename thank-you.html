:root{--bg:#FBF8F3;--head:#0D5450;--accent:#2DA093;--text:#14221F;--muted:#3F5551;--tint:#EAF2EF;--line:#E6DDCF;--coral:#F87966}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto;text-decoration:none}
.brand img{height:58px;width:auto;display:block}
.brand span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--head);font-size:1.5rem;letter-spacing:-.01em}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:36px 28px;max-width:560px;width:100%;text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--tint);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.check svg{width:38px;height:38px;stroke:var(--head);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--head);font-size:clamp(2rem,7vw,2.7rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:12px}
.bar{width:90px;height:8px;border-radius:4px;background:var(--coral);margin:0 auto 20px}
p{color:var(--muted)}
.sooner{margin-top:22px;font-weight:700;color:var(--text)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;font:700 1rem 'Figtree',sans-serif;border:2px solid var(--head);border-radius:999px;padding:.75em 1.6em;text-decoration:none}
.btn-main{background:var(--head);color:#fff}
.btn-line{background:transparent;color:var(--head)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.tag{margin-top:26px;font-weight:600;color:var(--head)}
